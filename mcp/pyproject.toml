[project]
name = "incident-log-mcp"
version = "0.1.0"
description = "MCP server for logging incidents"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.0.0", "httpx"]

[project.scripts]
incident-log-mcp = "incident_log_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"